name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — that is deliberate. A verification tool
      # that can itself break from a transitive update is not a gate.
      - run: node --test
      # Baselines must be byte-identical across OS and Node version, or they
      # are not baselines. This matrix is the test of that claim.
      - run: node examples/physics/baseline.js
      - run: node examples/physics/demo.js
